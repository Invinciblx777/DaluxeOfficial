<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <!-- Gold Rim Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff8dc"/>
      <stop offset="80%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
    
    <!-- Marble Texture Gradient -->
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f5f5"/>
      <stop offset="45%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <!-- Gold base shadow/rim -->
  <ellipse cx="200" cy="90" rx="180" ry="25" fill="url(#gold)"/>
  <path d="M 20 90 L 20 100 A 180 25 0 0 0 380 100 L 380 90 Z" fill="url(#gold)"/>

  <!-- Marble Body -->
  <ellipse cx="200" cy="85" rx="180" ry="25" fill="url(#marble)"/>
  <path d="M 20 30 L 20 85 A 180 25 0 0 0 380 85 L 380 30 Z" fill="url(#marble)"/>
  
  <!-- Marble Highlights/Veins (Simplified) -->
  <path d="M 50 50 Q 100 80 150 40 T 250 60" fill="none" stroke="#d3d3d3" stroke-width="2" opacity="0.5"/>
  <path d="M 180 40 Q 220 70 280 30 T 350 50" fill="none" stroke="#d3d3d3" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Marble Top Surface -->
  <ellipse cx="200" cy="30" rx="180" ry="25" fill="#ffffff"/>
  
  <!-- Inner Drop Shadow on Top Surface -->
  <ellipse cx="200" cy="30" rx="178" ry="23" fill="none" stroke="#e0e0e0" stroke-width="2" opacity="0.6"/>
</svg>
